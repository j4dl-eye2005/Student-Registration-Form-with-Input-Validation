<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration Form</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">
<h1>IT Seminar Registration</h1>

<form id="registrationForm" novalidate>

<div class="field">
<label for="fullName">Full Name</label>
<input type="text" id="fullName" name="fullName" required aria-describedby="fullNameError">
<span class="error" id="fullNameError" aria-live="polite"></span>
</div>

<div class="field">
<label for="studentNumber">Student Number</label>
<input type="text" id="studentNumber" name="studentNumber" placeholder="24-1234-123" required aria-describedby="studentNumberError">
<span class="error" id="studentNumberError" aria-live="polite"></span>
</div>

<div class="field">
<label for="email">Email Address</label>
<input type="email" id="email" name="email" required aria-describedby="emailError">
<span class="error" id="emailError" aria-live="polite"></span>
</div>

<div class="field">
<label for="mobileNumber">Mobile Number</label>
<input type="tel" id="mobileNumber" name="mobileNumber" placeholder="09171234567" required aria-describedby="mobileNumberError">
<span class="error" id="mobileNumberError" aria-live="polite"></span>
</div>

<div class="field">
<label for="password">Password</label>
<input type="password" id="password" name="password" required aria-describedby="passwordError passwordFeedback">
<span class="feedback" id="passwordFeedback" aria-live="polite"></span>
<span class="error" id="passwordError" aria-live="polite"></span>
</div>

<div class="field">
<label for="confirmPassword">Confirm Password</label>
<input type="password" id="confirmPassword" name="confirmPassword" required aria-describedby="confirmPasswordError">
<span class="error" id="confirmPasswordError" aria-live="polite"></span>
</div>

<div class="field">
<label for="course">Course</label>
<select id="course" name="course" required aria-describedby="courseError">
<option value="">Select your course</option>
<option value="BSIT">BSIT</option>
<option value="BSCS">BSCS</option>
</select>
<span class="error" id="courseError" aria-live="polite"></span>
</div>

<div class="field">
<input type="checkbox" id="terms" name="terms" required aria-describedby="termsError">
<label for="terms" class="inline">I agree to the terms and conditions</label>
<span class="error" id="termsError" aria-live="polite"></span>
</div>

<div class="buttons">
<button type="submit" id="registerBtn">Register</button>
<button type="reset" id="resetBtn">Reset</button>
</div>

</form>

<p id="successMessage" class="success"></p>

<div id="registrationSummary" class="summary" hidden>
<h2>Registration Summary</h2>
<p>Full Name: <span id="summaryName"></span></p>
<p>Student Number: <span id="summaryStudentNumber"></span></p>
<p>Email: <span id="summaryEmail"></span></p>
<p>Mobile Number: <span id="summaryMobileNumber"></span></p>
<p>Course: <span id="summaryCourse"></span></p>
</div>

</div>

<script src="js/app.js"></script>
</body>
</html>
